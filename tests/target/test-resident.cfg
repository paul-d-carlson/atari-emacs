FEATURES {
    STARTADDRESS: default = $1E00;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;  # force inclusion of "system check" load chunk
    __AUTOSTART__:       type = import;  # force inclusion of autostart "trailer"
    __STACKSIZE__: type = weak, value = $0100; # MUST match test-overlay.cfg's
                                                # assumed stack size exactly --
                                                # both configs derive the same
                                                # fixed OVERLAY_BASE address
                                                # from $BC20/__STACKSIZE__/the
                                                # reserved-memory size.
    __STARTADDRESS__:    type = export, value = %S;

    # Reserves $14A2 (5282 bytes) at the TOP of the MAIN region, just
    # below the stack, split into two fixed sub-regions used by the
    # disk-overlay test architecture (see abi_table.h):
    #   - the first $13EC (5100 bytes) is the OVERLAY window: never
    #     written by this (resident) image's own linker -- intentionally
    #     left alone so overlay_loader.c can fread() a suite's compiled
    #     overlay image directly into that live address range at runtime.
    #     Sized just above the largest overlay (test_display.c, 4890
    #     bytes); kept tight on purpose so the freed RAM goes to the
    #     resident heap. History: shrunk from $1BEA to $1B00 to $1A50 to
    #     $1400 (see abi_table.h's OVERLAY_SIZE comment for the
    #     heap-corruption regression chased across those changes; the
    #     actual fix was splitting test_random2.c/test_display.c into
    #     three/two files each, dropping the largest-overlay floor to
    #     4890 bytes). Most recently shrunk by 20 bytes ($1400 -> $13EC)
    #     to grow the ABITABLE region below for the window.c/termio.c
    #     suites' 10 new exported slots.
    #   - the last $00B6 (182 bytes) is the ABITABLE segment below,
    #     populated by abi_export.c with the real addresses overlay
    #     suites need to call back into this resident image. Grew from
    #     $0080 when the random.c suite added 11 new exported slots, to
    #     $0096 when the search.c suite added 6 more, and to $00B6 when
    #     the window.c/termio.c suites added 10 more
    #     (reposition/refresh/ttopen/ttclose/ttflush/ttputc/ttgetc/
    #     ttgetc_noshow/typahead/sgarbf).
    # Both sub-region addresses are re-derived independently in
    # abi_table.h (shared by both this and every overlay's build) --
    # keep all three in sync if any of $BC20/__STACKSIZE__/this value
    # ever changes.
    __RESERVED_MEMORY__: type = weak, value = $14A2;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;

# file header, just $FFFF
    HEADER:     file = %O,               start = $0000, size = $0002;

# "system check" load chunk
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;

# "main program" load chunk
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;

# Fixed-address cross-image ABI table (see abi_table.h/abi_export.c) --
# its own DOS binary-load chunk (own 4-byte {start,end} address header,
# like MAINHDR/MAIN above), so its address stays fixed regardless of how
# large MAIN's own CODE/RODATA/DATA/BSS grows. MUST come before TRAILER
# below: the autostart trailer's RUNAD write must be the very last thing
# DOS processes when loading this file, or auto-run won't trigger
# correctly at the right moment.
    ABITABHDR:  file = %O,               start = $0000, size = $0004;
    ABITAB:     file = %O, define = yes, start = $BC20 - $00B6, size = $00B6;

    TRAILER:    file = %O,               start = $0000, size = $0006;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;  # not zero initialized
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    DATA:      load = MAIN,       type = rw;
    INIT:      load = MAIN,       type = rw,                optional = yes;
    BSS:       load = MAIN,       type = bss, define = yes;
    ABITABHDR: load = ABITABHDR,  type = ro;
    ABITABLE:  load = ABITAB,     type = ro,  define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
