FEATURES {
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100; # MUST match test-resident.cfg exactly
}
MEMORY {
    ZP:      file = "", define = yes, start = $0082, size = $007E;

# Raw, headerless memory blob: no EXEHDR/SYSCHK/TRAILER DOS chunks at
# all -- this is NOT a bootable/auto-running program. It is fread()
# directly into the resident image's live OVERLAY window (see
# abi_table.h / overlay_loader.c) and invoked by JSR-ing to a fixed
# offset within it; the resident image's own boot already did the one
# real cold-start this whole test run needs.
#
# Fixed start address MUST exactly match OVERLAY_BASE in abi_table.h
# and the reserved-memory arithmetic in test-resident.cfg. This is the
# base of the __RESERVED_MEMORY__ region, which sits ABOVE cc65's
# software stack (initial sp = MEMTOP - __RESERVED_MEMORY__, growing
# downward) -- so NO extra __STACKSIZE__ offset here.
    OVERLAY: file = %O, define = yes, start = $BC20 - $14A2, size = $13EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp,                optional = yes;
    EXTZP:    load = ZP,      type = zp,                optional = yes;

    # Every suite's entry-point table (its `const test_fn xxx_tests[]`
    # array, optionally preceded by a one-off setup function pointer --
    # see test_basic.c) is pinned here via `#pragma rodata-name` so it
    # always lands at the very first byte of the window (OVERLAY_BASE),
    # regardless of what other RODATA (string literals, etc.) the suite
    # also happens to contain.
    OVLENTRY: load = OVERLAY, type = ro,  define = yes;

    STARTUP:  load = OVERLAY, type = ro,  define = yes, optional = yes;
    LOWCODE:  load = OVERLAY, type = ro,  define = yes, optional = yes;
    ONCE:     load = OVERLAY, type = ro,                optional = yes;
    CODE:     load = OVERLAY, type = ro,  define = yes;
    RODATA:   load = OVERLAY, type = ro;
    DATA:     load = OVERLAY, type = rw;
    INIT:     load = OVERLAY, type = rw,                optional = yes;
    BSS:      load = OVERLAY, type = bss, define = yes;
}
